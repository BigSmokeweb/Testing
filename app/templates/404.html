{% extends "base.html" %}
{% block title %}404 — Page Not Found · AutoQA{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">404</div>
  <h1 class="error-title">Page not found</h1>
  <p class="error-sub">The page you're looking for doesn't exist or has been moved. Check the URL or head back home.</p>
  <div style="display:flex;gap:var(--sp-3);justify-content:center;flex-wrap:wrap;">
    <a href="/" class="btn btn-primary">Go Home</a>
    <a href="/history" class="btn btn-ghost">View History</a>
  </div>
</div>
{% endblock %}
